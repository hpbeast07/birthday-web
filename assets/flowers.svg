<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="flowerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#F5ECFA"/>
    </linearGradient>
    <filter id="fShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#D080A0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#flowerBg)"/>

  <!-- Wrapped Bouquet Kraft Paper -->
  <polygon points="120,380 280,380 320,220 80,220" fill="#E8D5C4" filter="url(#fShadow)"/>
  <polygon points="130,380 270,380 300,240 100,240" fill="#DEC0AA"/>

  <!-- Big Pink Satin Bow -->
  <path d="M 200 310 C 170 290 150 310 180 330 C 190 335 195 330 200 320 Z" fill="#FB6F92" filter="url(#fShadow)"/>
  <path d="M 200 310 C 230 290 250 310 220 330 C 210 335 205 330 200 320 Z" fill="#FB6F92" filter="url(#fShadow)"/>
  <circle cx="200" cy="316" r="8" fill="#FF8FAB"/>
  <!-- Ribbon tails -->
  <path d="M 195 322 Q 185 355 170 370" stroke="#FB6F92" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 205 322 Q 215 355 230 370" stroke="#FB6F92" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Green Stems & Leaves -->
  <path d="M 180 230 Q 150 190 130 180" stroke="#90BE6D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 200 230 Q 200 170 200 150" stroke="#90BE6D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 220 230 Q 250 190 270 180" stroke="#90BE6D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Leaf shapes -->
  <path d="M 160 210 Q 140 205 145 220 Q 155 215 160 210 Z" fill="#A3CE7A"/>
  <path d="M 235 205 Q 255 200 250 215 Q 240 210 235 205 Z" fill="#A3CE7A"/>

  <!-- Tulips and Peonies -->
  <!-- Left Tulip -->
  <path d="M 125 150 C 110 165 110 185 130 190 C 145 190 150 175 145 155 Z" fill="#FF8FAB" filter="url(#fShadow)"/>
  <path d="M 130 150 C 135 165 140 180 148 185 C 155 175 155 160 145 150 Z" fill="#FFB3C6"/>
  
  <!-- Right Tulip -->
  <path d="M 275 150 C 290 165 290 185 270 190 C 255 190 250 175 255 155 Z" fill="#C9A9E8" filter="url(#fShadow)"/>
  <path d="M 270 150 C 265 165 260 180 252 185 C 245 175 245 160 255 150 Z" fill="#E8D7F1"/>

  <!-- Center Big Peony/Rose -->
  <circle cx="200" cy="140" r="34" fill="#FFCCD8" filter="url(#fShadow)"/>
  <circle cx="200" cy="140" r="24" fill="#FFB3C6"/>
  <circle cx="200" cy="140" r="14" fill="#FB6F92"/>
  <path d="M 190 135 Q 200 125 210 135 Q 200 145 190 135 Z" fill="#FFF"/>

  <!-- Baby's Breath / Little White Flowers -->
  <circle cx="165" cy="160" r="5" fill="#FFF"/>
  <circle cx="170" cy="120" r="6" fill="#FFF"/>
  <circle cx="230" cy="125" r="5" fill="#FFF"/>
  <circle cx="240" cy="165" r="6" fill="#FFF"/>
  <circle cx="165" cy="160" r="2" fill="#FCD34D"/>
  <circle cx="170" cy="120" r="2" fill="#FCD34D"/>
  <circle cx="230" cy="125" r="2" fill="#FCD34D"/>
  <circle cx="240" cy="165" r="2" fill="#FCD34D"/>

  <!-- Sparkles & Hearts -->
  <path d="M 70 80 Q 70 90 80 90 Q 70 90 70 100 Q 70 90 60 90 Q 70 90 70 80 Z" fill="#FB6F92"/>
  <path d="M 330 90 Q 330 98 338 98 Q 330 98 330 106 Q 330 98 322 98 Q 330 98 330 90 Z" fill="#FCD34D"/>

  <!-- Cute typography -->
  <text x="200" y="55" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#705364" text-anchor="middle">A Bouquet of Endless Love 🌷</text>
</svg>
