<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A306D"/>
      <stop offset="45%" stop-color="#7B4E8C"/>
      <stop offset="85%" stop-color="#DDA0DD"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#nightSky)"/>

  <!-- Glowing Crescent Moon -->
  <path d="M 120 70 A 55 55 0 0 0 175 125 A 45 45 0 0 1 110 70 Z" fill="#FEF3C7" filter="url(#glow)"/>

  <!-- Twinkling Stars -->
  <path d="M 280 80 Q 280 92 292 92 Q 280 92 280 104 Q 280 92 268 92 Q 280 92 280 80 Z" fill="#FFF" filter="url(#glow)"/>
  <path d="M 220 130 Q 220 138 228 138 Q 220 138 220 146 Q 220 138 212 138 Q 220 138 220 130 Z" fill="#FCD34D"/>
  <path d="M 340 140 Q 340 146 346 146 Q 340 146 340 152 Q 340 146 334 146 Q 340 146 340 140 Z" fill="#FFF"/>
  <path d="M 70 180 Q 70 186 76 186 Q 70 186 70 192 Q 70 186 64 186 Q 70 186 70 180 Z" fill="#FFCCD8"/>
  <path d="M 160 190 Q 160 195 165 195 Q 160 195 160 200 Q 160 195 155 195 Q 160 195 160 190 Z" fill="#FEF3C7"/>

  <!-- Tiny dots stars -->
  <circle cx="90" cy="140" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="210" cy="70" r="2" fill="#FFF" opacity="0.9"/>
  <circle cx="250" cy="170" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="310" cy="95" r="2" fill="#FEF3C7" opacity="0.85"/>
  <circle cx="360" cy="180" r="1.5" fill="#FFF" opacity="0.7"/>

  <!-- Dreamy pastel clouds at bottom -->
  <path d="M -20 340 C 20 300 80 300 120 330 C 160 295 240 295 280 325 C 320 295 380 305 420 340 L 420 420 L -20 420 Z" fill="#FFEBF2" opacity="0.65"/>
  <path d="M 10 365 C 60 335 130 335 180 360 C 220 335 290 335 340 360 C 370 340 400 350 430 365 L 430 420 L 10 420 Z" fill="#FFF5FA"/>

  <!-- Shooting Star with Trail -->
  <path d="M 330 60 L 250 110" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="330" y1="60" x2="250" y2="110" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="250" cy="110" r="3" fill="#FFF" filter="url(#glow)"/>

  <!-- Cute constellations & text -->
  <text x="200" y="270" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#FFF" text-anchor="middle" filter="url(#glow)">Under the Same Dreamy Sky 🌙</text>
  <text x="200" y="300" font-family="'Caveat', cursive, sans-serif" font-size="20" fill="#FFE4EC" text-anchor="middle">Making wishes that never fade ✨</text>
</svg>
