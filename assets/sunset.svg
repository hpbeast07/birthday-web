<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cottonSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A9E8"/>
      <stop offset="35%" stop-color="#FFB3C6"/>
      <stop offset="70%" stop-color="#FFD1BA"/>
      <stop offset="100%" stop-color="#FFF3E8"/>
    </linearGradient>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#cottonSunset)"/>

  <!-- Soft Golden Sun Setting -->
  <circle cx="200" cy="240" r="55" fill="#FFF4D0" filter="url(#sunGlow)"/>

  <!-- Fluffy Cotton Candy Clouds -->
  <!-- Layer 1 Back -->
  <circle cx="80" cy="270" r="45" fill="#FFCCD8" opacity="0.7"/>
  <circle cx="130" cy="255" r="55" fill="#FFCCD8" opacity="0.7"/>
  <circle cx="280" cy="265" r="50" fill="#E8D7F1" opacity="0.7"/>
  <circle cx="330" cy="275" r="40" fill="#E8D7F1" opacity="0.7"/>

  <!-- Layer 2 Front -->
  <circle cx="50" cy="330" r="60" fill="#FFF0F5" opacity="0.9"/>
  <circle cx="120" cy="310" r="70" fill="#FFF0F5" opacity="0.9"/>
  <circle cx="200" cy="325" r="75" fill="#FFFDF9" opacity="0.95"/>
  <circle cx="280" cy="310" r="70" fill="#FFF0F5" opacity="0.9"/>
  <circle cx="350" cy="330" r="60" fill="#FFF0F5" opacity="0.9"/>

  <!-- Floating Paper Plane with Love Note Trail -->
  <g transform="translate(140, 110) rotate(-15)">
    <!-- Dashed Trail -->
    <path d="M -80 40 Q -40 20 0 10" fill="none" stroke="#FB6F92" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Tiny heart on trail -->
    <path d="M -40 22 C -42 19 -46 20 -46 23 C -46 26 -40 29 -40 29 C -40 29 -34 26 -34 23 C -34 20 -38 19 -40 22 Z" fill="#FB6F92"/>
    <!-- Folded Paper Plane -->
    <polygon points="40,5 0,15 15,0" fill="#FFFFFF"/>
    <polygon points="40,5 0,15 5,7" fill="#FFE4EC"/>
    <polygon points="40,5 5,7 15,0" fill="#FFF5FA"/>
  </g>

  <!-- Sparkles in Sky -->
  <path d="M 60 70 Q 60 80 70 80 Q 60 80 60 90 Q 60 80 50 80 Q 60 80 60 70 Z" fill="#FFF"/>
  <path d="M 320 60 Q 320 72 332 72 Q 320 72 320 84 Q 320 72 308 72 Q 320 72 320 60 Z" fill="#FEF3C7"/>
  <path d="M 280 140 Q 280 148 288 148 Q 280 148 280 156 Q 280 148 272 148 Q 280 148 280 140 Z" fill="#FFCCD8"/>

  <text x="200" y="50" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#705364" text-anchor="middle">Golden Hours &amp; Happy Moments 🌅</text>
  <text x="200" y="375" font-family="'Caveat', cursive, sans-serif" font-size="20" fill="#8E65B5" text-anchor="middle">May all your days be this beautiful ✨</text>
</svg>
