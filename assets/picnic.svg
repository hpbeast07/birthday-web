<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#F5E6FA"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD8"/>
      <stop offset="100%" stop-color="#FFB3C6"/>
    </linearGradient>
    <pattern id="gingham" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FFE4EC"/>
      <rect width="12" height="12" fill="#FFCCD8" opacity="0.6"/>
      <rect x="12" y="12" width="12" height="12" fill="#FFCCD8" opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#E07090" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Dreamy Clouds / Sparkles -->
  <circle cx="80" cy="90" r="35" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="110" cy="80" r="45" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="145" cy="95" r="30" fill="#FFFFFF" opacity="0.7"/>

  <!-- Sparkles -->
  <path d="M 320 80 Q 320 95 335 95 Q 320 95 320 110 Q 320 95 305 95 Q 320 95 320 80 Z" fill="#FCD34D"/>
  <path d="M 70 200 Q 70 210 80 210 Q 70 210 70 220 Q 70 210 60 210 Q 70 210 70 200 Z" fill="#FB6F92" opacity="0.8"/>
  <path d="M 330 220 Q 330 228 338 228 Q 330 228 330 236 Q 330 228 322 228 Q 330 228 330 220 Z" fill="#C9A9E8"/>

  <!-- Picnic Blanket -->
  <polygon points="50,220 350,220 375,370 25,370" fill="url(#gingham)" filter="url(#shadow)"/>
  
  <!-- Picnic Basket -->
  <ellipse cx="140" cy="305" rx="55" ry="32" fill="#E8B87D" filter="url(#shadow)"/>
  <rect x="85" y="275" width="110" height="35" rx="10" fill="#DE9E62"/>
  <path d="M 110 275 C 110 235 170 235 170 275" fill="none" stroke="#C88448" stroke-width="6"/>
  <!-- Ribbon on Basket -->
  <path d="M 140 275 C 130 265 125 260 115 270 C 125 275 135 275 140 275 C 145 275 155 275 165 270 C 155 260 150 265 140 275 Z" fill="#FB6F92"/>

  <!-- Strawberry Plate -->
  <ellipse cx="260" cy="315" rx="48" ry="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Strawberries -->
  <path d="M 245 300 C 240 290 255 290 250 305 C 248 312 242 312 240 305 Z" fill="#EF476F"/>
  <circle cx="245" cy="302" r="1" fill="#FFF"/>
  <circle cx="247" cy="306" r="1" fill="#FFF"/>
  <path d="M 270 302 C 265 292 280 292 275 307 C 273 314 267 314 265 307 Z" fill="#EF476F"/>
  <path d="M 255 310 C 250 300 265 300 260 315 C 258 322 252 322 250 315 Z" fill="#EF476F"/>

  <!-- Drink Cup with Straw -->
  <rect x="200" y="240" width="30" height="45" rx="5" fill="#FFE4EC" opacity="0.9" filter="url(#shadow)"/>
  <rect x="202" y="250" width="26" height="32" rx="3" fill="#FFB3C6"/>
  <line x1="215" y1="245" x2="225" y2="220" stroke="#FB6F92" stroke-width="4" stroke-linecap="round"/>
  <!-- Heart on Cup -->
  <path d="M 215 268 C 213 264 209 265 209 268 C 209 272 215 275 215 275 C 215 275 221 272 221 268 C 221 265 217 264 215 268 Z" fill="#FFF"/>

  <!-- Daisies on Blanket -->
  <circle cx="95" cy="335" r="7" fill="#FCD34D"/>
  <circle cx="95" cy="324" r="5" fill="#FFFFFF"/>
  <circle cx="95" cy="346" r="5" fill="#FFFFFF"/>
  <circle cx="84" cy="335" r="5" fill="#FFFFFF"/>
  <circle cx="106" cy="335" r="5" fill="#FFFFFF"/>

  <!-- Cute Text -->
  <text x="200" y="55" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#D94876" text-anchor="middle">Picnic Days &amp; Sweet Sunshine ✨</text>
</svg>
